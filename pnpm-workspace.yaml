packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

minimumReleaseAgeExclude:
  - '@angular-devkit/architect@0.2202.3'
  - '@angular-devkit/core@22.2.3'
  - '@angular-devkit/schematics@22.2.3'
  - '@angular/build@22.2.3'
  - '@angular/cli@22.2.3'
  - '@ng-native/components@0.14.0'
  - '@ng-native/device@0.14.0'
  - '@ng-native/fabric@0.14.0'
  - '@ng-native/metro@0.14.0'
  - '@ng-native/platform@0.14.0'
  - '@ng-native/testing@0.14.0'
  - '@schematics/angular@22.2.3'

nodeLinker: hoisted

supportedArchitectures:
  os:
    - current
  cpu:
    - current
  libc:
    - current
